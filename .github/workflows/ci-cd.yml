name: CI/CD

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure external network exists
        run: docker network inspect extra_services >/dev/null 2>&1 || docker network create extra_services

      - name: Validate docker compose
        run: docker compose config -q

      - name: Build images
        run: docker compose build

      - name: Check nginx config
        run: |
          docker run --rm \
            --add-host chat-backend:127.0.0.1 \
            --add-host chat-web:127.0.0.1 \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

  deploy:
    name: Deploy (SSH -> docker compose)
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            export DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}'
            if [ -z "$DEPLOY_PATH" ]; then export DEPLOY_PATH="/var/www/Diary-project/tg-chat"; fi
            export DEPLOY_BRANCH='${{ secrets.DEPLOY_BRANCH }}'
            if [ -z "$DEPLOY_BRANCH" ]; then export DEPLOY_BRANCH="master"; fi
            cd "$DEPLOY_PATH"
            git fetch --prune origin
            git reset --hard "origin/${DEPLOY_BRANCH}"
            bash ".github/deploy_ssh.sh"
