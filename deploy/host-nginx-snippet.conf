# Два внешних прокси. WebSocket должен пройти оба.
# 403 на /extra/chat/api/ws без токена — норма: бэкенд отклонил handshake, путь живой.

# --- 1. Главный HTTPS (prod, includes/extra.conf) ---
# Сейчас location /extra/ отдаёт на extra_nginx без Upgrade — браузерный wss здесь и рвётся.
# Вставить ПЕРЕД общим location /extra/ (более длинный префикс победит).

location /extra/chat/api/ws {
    proxy_pass http://extra_nginx;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# Общий /extra/ можно не трогать: остальные сервисы не получат Connection: upgrade.


# --- 2. Шлюз extra_nginx (tg-chat.conf) ---
# Upgrade у вас уже есть. Добавьте таймауты и отдельный location для ws.

location /extra/chat/api/ws {
    proxy_pass http://chat:80/extra/chat/api/ws;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location /extra/chat/ {
    proxy_pass http://chat:80/extra/chat/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    client_max_body_size 64m;
}

location = /extra/chat {
    return 301 /extra/chat/;
}
