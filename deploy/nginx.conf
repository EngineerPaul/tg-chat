client_max_body_size 64m;
client_body_timeout 300s;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    location = /extra/chat/chat.apk {
        alias /apk/chat.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="chat.apk"';
        add_header Cache-Control "no-cache";
    }

    location /extra/chat/api/ {
        proxy_pass http://backend:8000/extra/chat/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }

    location /extra/chat/ {
        proxy_pass http://web:3000/extra/chat/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /extra/chat {
        return 301 /extra/chat/;
    }
}
